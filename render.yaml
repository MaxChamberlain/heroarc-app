# Render Blueprint for HeroArc. Spec: https://render.com/docs/blueprint-spec
# This file is CODEOWNERS-protected: changes need a human review.
#
# Services:
#   heroarc-web     TanStack Start (people)         → app.<domain>
#   heroarc-api     NestJS (web API, auth, agents)  → api.<domain>
#   heroarc-worker  BullMQ worker (same code as api)
#   heroarc-db      Postgres
#   heroarc-kv      Key Value (Valkey)
#
# Secrets are never in this file: `sync: false` values are asked for when the Blueprint is
# created (then edited in the dashboard); BETTER_AUTH_SECRET is generated by Render.

previews:
  # Preview environments need a Render Pro workspace. Switch to `manual` to enable.
  generation: off

services:
  - type: web
    name: heroarc-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash scripts/render-build.sh '@heroarc/web...'
    startCommand: node apps/web/.output/server/index.mjs
    healthCheckPath: /healthz
    # Deploy only after the commit's GitHub checks (CI) have passed.
    autoDeployTrigger: checksPass
    # Custom domain (add the DNS record Render shows you):
    # domains:
    #   - app.example.com
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - scripts/render-build.sh
    envVars:
      - key: NODE_ENV
        value: production
      # The web server proxies /api/* here over Render's private network.
      - key: INTERNAL_API_HOSTPORT
        fromService:
          type: web
          name: heroarc-api
          property: hostport

  - type: web
    name: heroarc-api
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash scripts/render-build.sh '@heroarc/api...'
    # Applies pending Drizzle migrations before the new version starts.
    preDeployCommand: node packages/db/dist/migrate.js
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    # domains:
    #   - api.example.com
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - scripts/render-build.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heroarc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: heroarc-kv
          property: connectionString
      # Public addresses (HTTPS): where people use the app, and where agents and MCP reach the
      # API. Sign-in links, cookies and OAuth tokens are bound to them.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Signs sessions and encrypts token-signing keys. Generated once; changing it signs
      # everyone out and makes connected apps sign in again.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Email: invites, confirmations, password resets (Resend, from a verified domain).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Google sign-in (optional): an OAuth client with https://<app>/api/auth/callback/google.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Coach: Claude, and OpenAI for voice notes.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: worker
    name: heroarc-worker
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: bash scripts/render-build.sh '@heroarc/api...'
    startCommand: node apps/api/dist/worker.js
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
        - scripts/render-build.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: heroarc-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: heroarc-kv
          property: connectionString

  - type: keyvalue
    name: heroarc-kv
    region: oregon
    plan: 256mb
    # BullMQ requires noeviction (queued jobs must never be evicted).
    maxmemoryPolicy: noeviction
    # Private network only.
    ipAllowList: []

databases:
  - name: heroarc-db
    region: oregon
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: heroarc
    user: heroarc
    # Private network only.
    ipAllowList: []
